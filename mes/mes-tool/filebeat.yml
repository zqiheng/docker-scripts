filebeat.idle_timeout: 2s
filebeat.spool_size: 50000
logging.files:
  keepfiles: 7
  name: filebeat
  path: /var/log/filebeat
  permissions: 420
logging.level: info
logging.to_files: true

processors:
  - add_cloud_metadata: null
  - add_host_metadata: null
  - truncate_fields:
      fail_on_error: false
      fields:
        - message
      ignore_missing: true
      max_bytes: 4000

filebeat.inputs:
  # DEMO 环境
  # mycim-oms-foundation
  - close_inactive: 2h
    fields:
      env: demo
      type: mycim-oms-foundation
    harvester_buffer_size: 262144
    ignore_older: 4h
    max_backoff: 10s
    max_bytes: 10485760
    multiline.match: after
    multiline.negate: true
    multiline.pattern: ^(-|[0-9]{2,4})
    multiline.type: pattern
    paths:
      - /logs/mycim-oms-foundation.log
    scan_frequency: 10s
    tail_lines: true
    type: log
  # mycim-mds-foundation
