services:
  standalone:
    image: registry.cn-hangzhou.aliyuncs.com/mycim4/pulsar:2.10.2
    container_name: pulsar
    restart: always
    privileged: true
    environment:
      - BOOKIE_MEM=" -Xms512m -Xmx512m -XX:MaxDirectMemorySize=1g"
    volumes:
      - /home/mnt/pulsar/pulsardata:/pulsar/data:rw
      #- ./pulsar/pulsarconf/standalone.conf:/pulsar/conf/standalone.conf:rw
    ports:
      - "28080:8080"
      - "6650:6650"
      - "3181:3181"
    networks:
      - mycim
    command: >
      /bin/bash -c
      "bin/apply-config-from-env.py conf/standalone.conf
      && exec bin/pulsar standalone --no-functions-worker --no-stream-storage --advertised-address standalone"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "2G"

  pulsar-manager:
    image: apachepulsar/pulsar-manager:v0.4.0
    container_name: pulsar-manager
    restart: always
    privileged: true
    ports:
      - "9527:9527"
      - "7750:7750"
    networks:
      - mycim
    environment:
      - SPRING_CONFIGURATION_FILE=/pulsar-manager/pulsar-manager/application.properties
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "2G"

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/mycim4/redis:6.2.7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    privileged: true
    volumes:
      - /home/mnt/redis/data:/data:rw
      - /home/mnt/redis/logs:/logs:rw
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:rw
    networks:
      - mycim
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "4G"

