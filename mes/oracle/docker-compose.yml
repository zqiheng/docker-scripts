services:
  # oracle
  # 启动后会默认开启两个账号：sys,system
  # 启动后可修改密码：docker exec oracle19c ./setPassword.sh oracle
  oracle19c:
    image: registry.cn-hangzhou.aliyuncs.com/mycim4/oracle:19.3.0-ee
    container_name: oracle19c
    ports:
      - "1521:1521"
    restart: always
    privileged: true
    environment:
      - TZ=Asia/Shanghai
      - ORACLE_SID=mycim4
      #- ORACLE_PDB=fapdb
      #- ORACLE_EDITION=standard
      - ORACLE_CHARACTERSET=AL32UTF8
      - ORACLE_PWD=fa123456
    volumes:
      - /home/mnt/oracle/data:/opt/oracle/oradata:rw
      # 初始化过程中执行某些sql语句或bash脚本，需要将这些脚本放在/opt/oracle/scripts/setup(dbINIT/setup/)中
      # 如果我们需要在oracle自带的初始化完成之后也就是数据库创建成功之后执行脚本，则需要将这些脚本放在/opt/oracle/scripts/startup(dbINIT/startup/)中
      - ./dbINIT:/docker-entrypoint-initdb.d:rw
    deploy:
      resources:
        limits:
          cpus: '12'
          memory: 24G
