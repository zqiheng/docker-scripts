x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"
    tag: "{{.Name}}"

networks:
  elk-net:
    driver: bridge

# 注意事项：
# 1. 部署前请确认使用的镜像版本
# 2. 可自行更改挂载的路径
# 3. es 挂载路径授予 777 权限：chmod -R 777 /mnt/elk/es/
services:
  # es
  es:
    image: elasticsearch:7.17.25
    container_name: es
    privileged: true
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ES_JAVA_OPTS: "-Xmx512M -Duser.timezone=Asia/Shanghai -Dcom.linecorp.armeria.warnNettyVersions=false"
      discovery.type: single-node
    volumes:
      # 配置文件
      - ./config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      # 插件文件挂载
      #- /mnt/elk/es/plugins:/usr/share/elasticsearch/plugins
      # 数据文件挂载
      #- /mnt/elk/es/data:/usr/share/elasticsearch/data
      # 日志文件挂载
      #- /mnt/elk/es/logs:/usr/share/elasticsearch/logs
    ports:
      - '19200:9200'
      - '19300:9300'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 512M
    networks:
      - elk-net
    logging: *logging

  # kibana
  kibana:
    image: kibana:7.17.25
    container_name: kibana
    privileged: true
    restart: unless-stopped
    ports:
      - '15601:5601'
    environment:
      TZ: Asia/Shanghai
      ELASTICSEARCH_HOSTS: http://es:9200
    depends_on:
      - es
    networks:
      - elk-net
    volumes:
      - ./config/kibana.yml:/usr/share/kibana/config/kibana.yml
      #- /mnt/elk/kibana/logs:/usr/share/kibana/logs
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 512M
    logging: *logging

  # LogStash
  logstash:
    image: logstash:7.17.25
    container_name: logstash
    privileged: true
    restart: unless-stopped
    ports:
      - '5044:5044'
      - '9600:9600'
    environment:
      TZ: Asia/Shanghai
      ES_JAVA_OPTS: "-Duser.timezone=Asia/Shanghai"
    volumes:
      - ./config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - es
    networks:
      - elk-net
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 512M
    logging: *logging

  # Filebeat
  filebeat:
    image: elastic/filebeat:7.17.25
    container_name: filebeat
    privileged: true
    restart: unless-stopped
    volumes:
      - ./config/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - /Users/eric/IdeaProjects/my/temporal-demo/temporal-demo/logs/temporal-demo.log:/var/log/dev/temporal-demo/all.log
    networks:
      - elk-net
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 512M
    logging: *logging

