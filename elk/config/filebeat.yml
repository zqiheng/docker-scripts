filebeat.config:
  modules:
    path: ${path.config}/modules.d/*.yml
    reload.enabled: false

# spooler 的超时时间。如果到了超时时间spooler也会清空发送出去不论是否达到容量的阈值
# filebeat.idle_timeout: 2s
# spooler 的大小。事件数量超过这个阈值的时候就会清空发送出去，不论是否到达超时时间
# filebeat.spool_size: 50000
# 记录 filebeat 处理日志文件的位置文件
# filebeat.registry_file: /var/lib/filebeat/registry

# 日志记录系统可以将日志写入系统日志或循环日志文件。如果未显式配置日志记录，则使用文件输出。参考：https://www.elastic.co/guide/en/beats/filebeat/current/configuration-logging.html
# logging.level: info
# 日志发送到滚动文件
# logging.to_files: true
# logging.files:
#   # 日志文件目录
#   path: /var/log/filebeat
#   # 日志文件名称
#   name: filebeat
# 	# 保留日志周期，默认7.值范围为 2～1024
#   keepfiles: 7
#   # 日志文件的最大大小。默认 10485760（10MB）
#   rotateeverybytes: 10485760
#   permissions: 0640


# 使用处理器过滤和增强数据，参考：https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html
# processors:
#   - add_cloud_metadata: ~
#   - add_docker_metadata: ~
#   # 截断字段
#   - truncate_fields:
#       fields:
#         - message
#       max_bytes: 4000
#       fail_on_error: false
#       ignore_missing: true

# 输入配置
filebeat.inputs:
  # filebeat的类型，log(具体路径的日志),stdin(键盘输入),redis,udp,docker,tcp,syslog,可以同时配置多个(包括相同类型的)
  - type: log
    # 使用enabled选项启用和禁用输入。默认情况下，enabled设置为true。
    enabled: true
    #
    paths:
      - /var/log/dev/temporal-demo/all.log
    # 可选字段，您可以指定这些字段以将附加信息添加到输出.例如，可以添加可用于筛选日志的字段，数据字段可以是标量值、数组、字典或任何嵌套的这些的组合
    fields:
      app_name: temporal-demo
      env: dev
    # 如果此选项设置为true，则自定义字段将作为顶级字段存储在输出文档中，而不是分组在字段子字典下。如果自定义字段名称与Filebeat添加的其他字段名称冲突，则自定义字段将覆盖其他字段。
    # fields_under_root: true
    # Filebeat在每个已发布事件的tags字段中包含的标签列表。标签使您可以轻松地在Kibana中选择特定事件或在Logstash中应用条件过滤。这些标记将附加到常规配置中指定的标记列表中。
    # tags: ["tag1","tag2"]
    # 如果启用此选项，Filebeat将忽略在指定时间跨度之前修改的任何文件。如果您长期保留日志文件，配置ignore_older可能特别有用。例如，如果您想启动Filebeat，但只想发送最新的文件和上周的文件，则可以配置此选项。
    # 您可以使用时间字符串，如2h（2小时）和5m（5分钟）。默认值为0，表示禁用该设置。注释掉配置与将其设置为0具有相同的效果。
    # ignore_older: 4h
    # 用于控制自日志文件内容没有发生变更开始等待多久就将文件关闭，同时退出对应的harvester，默认为5m
    close_inactive: 2h
    # Filebeat检查指定用于收集路径中的新文件的频率，它会监控是否有新文件和已有文件变化。默认设置为10s
    # 如果你需要在接近真实的时间内发送日志行，不要使用很低的scan_frequency，而是调整close_inactive，这样文件处理程序就保持打开状态，并不断地轮询你的文件。
    scan_frequency: 10s
    # 每个收集器在获取文件时使用的缓冲区的字节大小。默认值为16384
    # harvester_buffer_size: 262144
    # 与实时性相关最重要的参数了，它的意思是当harvester检测并“收割”到一行日志更新后再等待多久才继续检查是否有新的日志行更新，默认为1s
    backoff: 1s
    # max_backoff意为两次扫描行等待时间的最大值，默认为10s。
    max_backoff: 10s
    # 当harvester读取到文件末尾时，它就不会再等backoff时间了，而是等待backoff * backoff_factor秒才进行下一次检测(backoff_factor默认为2)，直到达到mac_backoff为止。也就是说，当读到EOF后，harvester会先等待2s再检测变化，如果没有新内容，则等待4s, 再没有新内容，等8s, 直到达到10s最大值为止。如果将backoff_factor设为1则意为关闭此特性。这里如果对日志实时性要求较高，则最好把此参数设为1s, 或者将mac_backoff设为1s也能达到一样的效果。
    backoff_factor: 1
    # 单个日志消息可以具有的最大字节数，max_bytes之后的所有字节都将被丢弃且不发送。此设置对于多行日志消息特别有用，因为多行日志消息可能会变得很大。默认值为10MB（10485760）。
    # max_bytes: 10485760
    # 这个参数用来控制当开始监控一个新文件时(新文件的判断标准是在registry中是否存有这个文件的offset信息)是否从文件末尾开始读取，默认为false。此参数在第一次启动Filebeat时最好设成true, 因为如果不改的话，filebeat会把已经存在的一大坨日志文件全部发出去，可能会压垮下游。但当filebeat是在重启时，最好设为false, 因为如果为true, 当日志文件切割时新切割出的文件有可能会因为这个参数导致filebeat丢掉第一行数据。
    tail_lines: true
    # 控制Filebeat如何处理跨多行日志消息的选项。有关配置多行选项的详细信息，请参阅多行消息。https://www.elastic.co/guide/en/beats/filebeat/current/multiline-examples.html
    multiline.type: pattern
    multiline.pattern: '^(-|[0-9]{2,4})'
    multiline.negate: true
    multiline.match: after

# 输出配置
output.logstash:
  hosts: ["logstash:5044"]
